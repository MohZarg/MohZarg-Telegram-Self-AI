name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet
      - name: Build container image
        run: docker build --tag ghyiab-self:ci .
      - name: Smoke-test container and production authentication
        run: |
          set -eu
          docker run -d --name ghyiab-self-smoke -p 127.0.0.1:18000:8000 -e APP_ENV=production -e ADMIN_USERNAME=owner -e ADMIN_PASSWORD=ci-password-long-enough ghyiab-self:ci
          trap "docker rm -f ghyiab-self-smoke >/dev/null 2>&1 || true" EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/health > /tmp/ghyiab-health.json; then break; fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/ghyiab-health.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/api/status)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --user owner:ci-password-long-enough http://127.0.0.1:18000/api/status)" = 200

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and audit tool
        run: python -m pip install -e . pip-audit
      - name: Audit installed dependencies
        run: pip-audit --strict --skip-editable

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run tests
        run: python -m pytest
